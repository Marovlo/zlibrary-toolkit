# mock 订阅（仅用于本地测试解析逻辑，非真实节点）
mixed-port: 7890
proxies:
  - name: "HK-01"
    type: ss
    server: example.com
    port: 8388
    cipher: aes-256-gcm
    password: "test"
  - name: "JP-01"
    type: vmess
    server: example.jp
    port: 443
    uuid: "test-uuid"
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: "/"
  - name: "US-01"
    type: trojan
    server: example.us
    port: 443
    password: "test"
    sni: example.us
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "HK-01"
      - "JP-01"
      - "US-01"
rules:
  - MATCH,PROXY
