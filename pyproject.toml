[project]
name = "zlib"
version = "0.1.0"
description = "Z-Library 一键搜索下载工具（自动找官网/选代理/登录/下载）"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "rich>=13.7",
]

[project.optional-dependencies]
# Web 私人面板专用依赖，跟CLI 核心解耦：只克隆仓库用 CLI 的人不需要装这些。
# 安装方式：pip install -e ".[web]"
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
zlib = "zlibrary.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
