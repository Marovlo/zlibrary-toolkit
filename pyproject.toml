[project]
name = "zlib"
version = "0.1.0"
description = "Z-Library 一键搜索下载工具（自动找官网/选代理/登录/下载）"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "rich>=13.7",
]

[project.scripts]
zlib = "zlibrary.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
